name: CI

on:
    push:
        branches:
            - '**'
    pull_request:
        branches:
            - master

jobs:
    test-backend:
        name: Test backend
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                python-version: "3.12"
                cache: pip
            - run: |
                python -m pip install --upgrade pip
                pip install -r requirements.txt
            - run: pytest
            - run: ruff check .
    test-frontend:
        name: Test frontend
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                node-version: "25"
                cache: npm
            - run: npm ci